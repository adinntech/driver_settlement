# Driver Settlement production. Only these two services are managed from here.
# Frontend 127.0.0.1:3016, Backend 127.0.0.1:3017 (verified free on 2026-11-27).
name: driver-settlement
# Feature flag, one value for both services. The frontend takes it at build time, the backend at start.
x-roadshow: &roadshow "on"
services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: backend
    image: driver-settlement-backend:latest
    container_name: driver-settlement-backend
    restart: unless-stopped
    env_file: ./.env # server-only, never committed
    environment:
      NODE_ENV: production
      PORT: "5000"
      ROADSHOW: *roadshow
    ports:
      - "127.0.0.1:3017:5000"
    volumes:
      - driver_settlement_uploads:/app/public
    networks: [mongodb_default, driver-settlement-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: frontend
      args:
        NEXT_PUBLIC_ENVIRONMENT: live
        NEXT_PUBLIC_BASE_PATH: /driver-settlement
        NEXT_PUBLIC_API_BASE_URL: https://adinntech.in/driver-settlement/api
        NEXT_PUBLIC_ROADSHOW: *roadshow
    image: driver-settlement-frontend:latest
    container_name: driver-settlement-frontend
    environment:
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-live}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3016:3000"
    networks: [driver-settlement-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000' + (process.env.NEXT_PUBLIC_BASE_PATH||'') + '/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
networks:
  mongodb_default:
    external: true # existing network; the MongoDB container is NOT modified
  driver-settlement-network:
    name: driver-settlement-network
volumes:
  driver_settlement_uploads:
